[project]
name = "gitroast"
version = "0.1.1"
description = "Roasts your git commit history. Run it. Regret it."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Diwesh Saxena" }]
keywords = ["git", "cli", "fun", "roast", "commit-history"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
gitroast = "gitroast.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gitroast*"]
